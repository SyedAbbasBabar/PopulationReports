name: Java CI with MySQL

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: waleed123
          MYSQL_DATABASE: world
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pwaleed123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Wait for MySQL to be ready
      run: |
        for i in {1..30}; do
          echo "Checking if MySQL is ready... attempt $i"
          if mysqladmin ping -h 127.0.0.1 -u root -pwaleed123 --silent; then
            echo "MySQL is up!"
            break
          fi
          sleep 5
        done

    - name: Build and Test with Maven
      run: mvn clean install

    - name: Run Tests
      run: mvn test
